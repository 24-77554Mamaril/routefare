<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to RouteFare - Plan Your Journey</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/RouteFare_logo.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/images/BG.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero-content h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: white;
        }
        .hero-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
        .cta-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .cta-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <img src="assets/icons/RouteFare_logo.svg" alt="RouteFare Logo" style="height: 200px; width: 200px; border-radius: 50%; object-fit: cover; margin-bottom: 30px; border: 5px solid white;">
            <h1 style="font-size: 5rem; margin-bottom: 1rem;">ROUTEFARE</h1>
            <p style="font-size: 2rem; margin-bottom: 3rem;">Plan Your Route. Know Your Fare.</p>
            <a href="ROUTEFARE.html" class="cta-btn" style="padding: 1.5rem 3rem; font-size: 1.8rem;">Start Planning Now</a>
        </div>
    </section>
</body>
</html>
